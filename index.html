<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 5px;
            color: #cbd5e1;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #64748b;
            font-size: 15px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
            color: #2563eb;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }

        .panel h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            padding: 12px 18px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .edit-btn {
            background: #f59e0b;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search input {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;

            text-align: left;

            border-bottom:
                1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;

            border-radius: 6px;

            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        @media(max-width: 700px) {

            table {
                font-size: 13px;
            }

            .actions {
                flex-direction: column;
            }

            header {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>Inventory Management System</h1>

    <p>
        Manage your products easily
    </p>

</header>

<div class="container">

    <!-- Dashboard -->

    <div class="cards">

        <div class="card">

            <h3>Total Products</h3>

            <p id="totalProducts">
                0
            </p>

        </div>

        <div class="card">

            <h3>Total Quantity</h3>

            <p id="totalQuantity">
                0
            </p>

        </div>

        <div class="card">

            <h3>Total Inventory Value</h3>

            <p id="totalValue">
                ₹0
            </p>

        </div>

    </div>


    <!-- Add / Update Product -->

    <div class="panel">

        <h2 id="formTitle">
            Add Product
        </h2>

        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >

            <div class="form-grid">

                <input
                    type="text"
                    id="name"
                    placeholder="Product Name"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Save Product
                </button>

                <button
                    type="button"
                    onclick="cancelEdit()"
                    style="background:#64748b;"
                >
                    Clear
                </button>

            </div>

        </form>

        <div id="message" class="message"></div>

    </div>


    <!-- Product List -->

    <div class="panel">

        <h2>
            Products
        </h2>

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name or category..."
                onkeyup="searchProducts()"
            >

            <button onclick="loadProducts()">
                Refresh
            </button>

        </div>

        <div style="overflow-x:auto;">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Category</th>

                    <th>Quantity</th>

                    <th>Price</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="productTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const API = "http://localhost:8080";


// Load products

async function loadProducts() {

    try {

        const response =
            await fetch(API + "/api/products");

        const products =
            await response.json();

        displayProducts(products);

    }

    catch (error) {

        showMessage(
            "Cannot connect to Java backend. Make sure the server is running.",
            false
        );

    }

}


// Display products

function displayProducts(products) {

    const table =
        document.getElementById("productTable");

    table.innerHTML = "";

    let totalQuantity = 0;

    let totalValue = 0;

    products.forEach(product => {

        totalQuantity +=
            Number(product.quantity);

        totalValue +=
            Number(product.quantity) *
            Number(product.price);

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${product.id}</td>

            <td>${escapeHtml(product.name)}</td>

            <td>${escapeHtml(product.category)}</td>

            <td>${product.quantity}</td>

            <td>₹${Number(product.price).toFixed(2)}</td>

            <td>

                <div class="actions">

                    <button
                        class="edit-btn"
                        onclick='editProduct(${JSON.stringify(product)})'
                    >
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${product.id})"
                    >
                        Delete
                    </button>

                </div>

            </td>

        `;

        table.appendChild(row);

    });


    document.getElementById("totalProducts")
        .textContent = products.length;

    document.getElementById("totalQuantity")
        .textContent = totalQuantity;

    document.getElementById("totalValue")
        .textContent =
            "₹" + totalValue.toFixed(2);

}


// Add or update

document.getElementById("productForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const id =
            document.getElementById("productId").value;

        const data = new URLSearchParams();

        data.append(
            "name",
            document.getElementById("name").value
        );

        data.append(
            "category",
            document.getElementById("category").value
        );

        data.append(
            "quantity",
            document.getElementById("quantity").value
        );

        data.append(
            "price",
            document.getElementById("price").value
        );


        let url;

        if (id) {

            data.append("id", id);

            url = API + "/api/update";

        }

        else {

            url = API + "/api/add";

        }


        try {

            const response =
                await fetch(url, {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: data

                });


            const result =
                await response.json();


            if (result.success) {

                showMessage(
                    result.message,
                    true
                );

                cancelEdit();

                loadProducts();

            }

            else {

                showMessage(
                    result.message,
                    false
                );

            }

        }

        catch (error) {

            showMessage(
                "Could not connect to backend.",
                false
            );

        }

    });


// Edit product

function editProduct(product) {

    document.getElementById("productId")
        .value = product.id;

    document.getElementById("name")
        .value = product.name;

    document.getElementById("category")
        .value = product.category;

    document.getElementById("quantity")
        .value = product.quantity;

    document.getElementById("price")
        .value = product.price;

    document.getElementById("formTitle")
        .textContent = "Update Product";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// Cancel edit

function cancelEdit() {

    document.getElementById("productForm")
        .reset();

    document.getElementById("productId")
        .value = "";

    document.getElementById("formTitle")
        .textContent = "Add Product";

}


// Delete product

async function deleteProduct(id) {

    if (!confirm(
        "Are you sure you want to delete this product?"
    )) {
        return;
    }


    const data =
        new URLSearchParams();

    data.append("id", id);


    try {

        const response =
            await fetch(
                API + "/api/delete",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: data
                }
            );


        const result =
            await response.json();


        if (result.success) {

            showMessage(
                result.message,
                true
            );

            loadProducts();

        }

        else {

            showMessage(
                result.message,
                false
            );

        }

    }

    catch (error) {

        showMessage(
            "Could not connect to backend.",
            false
        );

    }

}


// Search

let searchTimer;

function searchProducts() {

    clearTimeout(searchTimer);

    searchTimer =
        setTimeout(async function() {

            const query =
                document.getElementById(
                    "searchInput"
                ).value.trim();


            if (query === "") {

                loadProducts();

                return;

            }


            try {

                const response =
                    await fetch(
                        API +
                        "/api/search?query=" +
                        encodeURIComponent(query)
                    );

                const products =
                    await response.json();

                displayProducts(products);

            }

            catch (error) {

                showMessage(
                    "Search failed.",
                    false
                );

            }

        }, 300);

}


// Message

function showMessage(text, success) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        success
            ? "message success"
            : "message error";


    setTimeout(function() {

        message.className =
            "message";

    }, 3000);

}


// Basic HTML escaping

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// Load when page opens

loadProducts();

</script>

</body>

</html>
